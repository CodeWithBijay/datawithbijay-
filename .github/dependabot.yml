# Dependabot opens a pull request when a package or GitHub Action has an update or a security fix.
# Security fixes arrive as soon as they're published; routine updates are grouped into one weekly pull request.
# Major version jumps (Next.js 16, TypeScript 7, React 20 …) are skipped: they often need code changes, and Next.js 15
# doesn't support TypeScript 7 yet. Do those upgrades by hand when you're ready.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
